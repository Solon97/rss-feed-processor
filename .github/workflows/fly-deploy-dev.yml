# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy (Dev)
on:
  push:
    branches:
      - develop

jobs:
  deploy_dev:
    name: Deploy app (dev)
    runs-on: ubuntu-latest
    concurrency: deploy-group-dev
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy to fly.io (dev)
        run: |
          # use --config fly.dev.toml if você separou o config de dev
          flyctl deploy --remote-only --config fly.dev.toml --app rss-feed-processor-dev
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_DEV_API_TOKEN }}
