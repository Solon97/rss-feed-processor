# Configuração Redis para RSS Feed Processor
# Otimizada para sistema de filas BullMQ

# Network
bind 0.0.0.0
port 6379
protected-mode no

# General
daemonize no
supervised no
pidfile /var/run/redis.pid
loglevel notice
logfile ""

# Persistence
save 900 1
save 300 10
save 60 10000
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# Memory Management
maxmemory-policy allkeys-lru
maxmemory 256mb

# Performance
tcp-keepalive 300
timeout 0
tcp-backlog 511

# Security
# requirepass your_password_here
# Descomente e defina uma senha para produção

# Client Management
maxclients 10000

# Slow Log
slowlog-log-slower-than 10000
slowlog-max-len 128

# Pub/Sub
notify-keyspace-events Ex

# Advanced
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
hll-sparse-max-bytes 3000

# Replication (para ambiente distribuído)
# replica-serve-stale-data yes
# replica-read-only yes

# Append Only File (AOF) - Para persistência adicional
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
