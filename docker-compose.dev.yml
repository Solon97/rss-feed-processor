version: '3.8'

# Docker Compose para desenvolvimento
# Use este arquivo para desenvolvimento local com hot-reload

services:
  # Redis - Sistema de filas
  redis:
    image: redis:7-alpine
    container_name: rss-dev-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_dev_data:/data
      - ./docker/redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    networks:
      - rss_dev_network
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3

  # Redis Commander - Interface web para monitorar Redis
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: rss-dev-redis-commander
    restart: unless-stopped
    ports:
      - '8081:8081'
    environment:
      - REDIS_HOSTS=local:redis:6379
      - HTTP_USER=admin
      - HTTP_PASSWORD=admin
    networks:
      - rss_dev_network
    depends_on:
      redis:
        condition: service_healthy

volumes:
  redis_dev_data:
    driver: local

networks:
  rss_dev_network:
    driver: bridge
